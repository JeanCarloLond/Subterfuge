name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que esté en curso: mejor que termine
# de publicar a dejar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar para Pages
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Antes de publicar, las mismas comprobaciones del CI: nunca debe llegar
      # a Pages una versión que no compila o con un nivel sin ruta de retorno.
      - name: Verificar
        run: npm run verificar
        env:
          BASE_URL: /Subterfuge/

      - name: Compilar
        run: npm run build
        env:
          # El sitio cuelga de github.io/Subterfuge/, no de la raíz del dominio.
          BASE_URL: /Subterfuge/

      # Subterfuge Sigma (#233): se exporta a web y se publica en /sigma/juego/,
      # bajo la página de entrada que trae public/sigma/. De las plantillas de
      # exportación (1,3 GB, todas las plataformas) solo se guarda la web de un
      # hilo: Pages no envía las cabeceras COOP/COEP que pide la de varios.
      - name: Godot y su plantilla web en caché
        id: cache-godot-web
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Instalar Godot y su plantilla web
        if: steps.cache-godot-web.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          plantillas=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$plantillas"
          curl -fsSL -o /tmp/plantillas.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/plantillas.tpz templates/version.txt templates/web_nothreads_release.zip -d "$plantillas"
          rm /tmp/plantillas.tpz

      - name: Importar Sigma
        run: ~/godot/godot --headless --path sigma --import

      # Como el resto: a Pages no llega un Sigma con los tests en rojo.
      - name: Tests de Sigma
        run: ~/godot/godot --headless --path sigma -s res://tests/ejecutar.gd

      # Godot puede acabar sin error aunque la exportación falle: se comprueba
      # que estén las piezas, y si falta alguna no se publica nada.
      - name: Exportar Sigma a web
        run: |
          mkdir -p dist/sigma/juego
          ~/godot/godot --headless --path sigma --export-release "Web" "$GITHUB_WORKSPACE/dist/sigma/juego/index.html"
          for pieza in index.html index.js index.wasm index.pck; do
            test -s "dist/sigma/juego/$pieza" || { echo "Falta $pieza en la exportación de Sigma"; exit 1; }
          done

      # Lo exportado no es lo del proyecto (#237): convertidas a binario, las
      # escenas perdían sus diálogos sin avisar. Se abre el paquete y se mira.
      - name: Comprobar lo exportado
        run: ~/godot/godot --headless --main-pack dist/sigma/juego/index.pck -s "$GITHUB_WORKSPACE/sigma/herramientas/comprobar_exportacion.gd"

      # `enablement` da de alta el sitio de Pages la primera vez, usando el
      # propio token del workflow. Sin esto, el despliegue falla con
      # "Get Pages site failed ... Not Found" en cada ejecución, que es lo que
      # llevaba pasando desde que se añadió: Pages nunca estuvo activado y el
      # enlace de "Jugar ahora" del README daba 404.
      #
      # Si aun así fallara, es que hace falta activarlo a mano una vez, y eso
      # solo puede hacerlo alguien con permiso de administración del repo:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
