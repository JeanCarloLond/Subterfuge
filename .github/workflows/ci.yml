name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: poner o quitar `sin-tests` vuelve a pasar el CI.
    # edited: cambiar el titulo de la PR vuelve a comprobar su nombre.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

# Si alguien empuja dos veces seguidas, cancela la ejecución anterior en vez de
# gastar minutos comprobando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Formato, reglas de código y tipos. Es lo más rápido, así que va primero:
  # da el aviso en menos de un minuto.
  calidad:
    name: Formato, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Reglas de código (ESLint)
        run: npm run lint

      - name: Comprobación de tipos (TypeScript)
        run: npm run typecheck

  # Tests unitarios (Vitest): el guardado, los ajustes, la memoria del portal,
  # el mando y la integridad del lore. Corren en Node y tardan segundos.
  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

  # Solo en los PR: si cambian lógica que se puede probar (sistemas, entrada,
  # módulos del portal) tienen que traer un test. La etiqueta `sin-tests` lo
  # salta para los cambios que de verdad no lo necesitan. Ver CONTRIBUTING.md.
  tests-en-el-pr:
    name: El PR trae sus tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta la historia para comparar con la rama destino.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Exigir tests a la lógica nueva
        env:
          SIN_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'sin-tests') && '1' || '0' }}
        run: node scripts/exigir-tests.mjs ${{ github.event.pull_request.base.sha }}

  # Solo en los PR: el titulo y cada commit siguen la convencion
  # `<gitmoji> <tipo>(<componente>): <descripcion>` (#179). El titulo cuenta
  # doble: al fusionar con squash, es el mensaje del commit que queda en main.
  convencion:
    name: Nombres de commits y PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # El titulo entra por variable de entorno, nunca pegado en el comando:
      # un titulo con comillas o $() no puede ejecutar nada.
      - name: Título de la PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: node scripts/verificar-commit.mjs --titulo "$TITULO"

      - name: Commits de la PR
        run: >-
          node scripts/verificar-commit.mjs --rango
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Comprobaciones propias del juego. No son linters: verifican que el
  # contenido siga siendo jugable, que es lo que un linter no puede ver.
  jugabilidad:
    name: Verificaciones de jugabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Una fila de más o de menos en el pixel art descuadra todo el dibujo.
      - name: Figuras del arte provisional
        run: npm run verificar-arte

      # Impide repetir el bug que dejaba al jugador encallado en el fondo de un
      # nivel, sin salto suficiente para volver a subir.
      - name: Rutas de retorno de los niveles
        run: npm run verificar-rutas

      # Lo que se lee en pantalla: sin "checkpoint", "mana" ni "boss", y con
      # sus tildes. Un texto sin acento solo se ve jugando (#122).
      - name: Textos visibles
        run: npm run verificar-textos

  # Subterfuge Sigma, el remake en Godot (#180): se importa el proyecto y se
  # pasan sus tests, sin abrir el editor y sin plugins.
  sigma:
    name: Subterfuge Sigma (Godot)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Godot en caché
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Instalar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Importar el proyecto
        run: ~/godot/godot --headless --path sigma --import

      - name: Tests de Sigma
        run: ~/godot/godot --headless --path sigma -s res://tests/ejecutar.gd

  # El build es lo que de verdad demuestra que la rama no está rota.
  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # Queda descargable desde la pestaña Actions: sirve para probar una rama
      # sin tener que clonarla y montarla en local.
      - name: Publicar el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: subterfuge-dist
          path: dist/
          retention-days: 14
