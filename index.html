<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      En movil hay que impedir que el navegador interprete los gestos: sin
      `user-scalable=no` un doble toque para atacar hace zoom, y con la barra
      de direcciones apareciendo y desapareciendo el lienzo baila. `viewport-fit`
      mete el juego bajo la muesca de los telefonos con notch (issue #65).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b090b" />
    <title>Subterfuge</title>
    <meta
      name="description"
      content="Metroidvania de horror corporal. Eres las Manos del Sacramento N.º 7 y bajas al Vientre a operar a una niña que nadie sorteó."
    />
    <!-- El icono es la cabeza del Cirujano, del mismo pixel art del juego (#154). -->
    <link rel="icon" type="image/png" href="/icono-juego.png" />
    <link rel="apple-touch-icon" href="/icono-juego-180.png" />
    <!-- Vista previa al compartir el enlace. La imagen va con la URL entera:
         WhatsApp y Discord no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Subterfuge" />
    <meta property="og:title" content="Subterfuge · Diócesis de la Carne" />
    <meta
      property="og:description"
      content="Eres las Manos del Sacramento N.º 7. Hoy bajas al Vientre a operar a una niña que nadie sorteó."
    />
    <meta property="og:url" content="https://jeancarlolond.github.io/Subterfuge/" />
    <meta
      property="og:image"
      content="https://jeancarlolond.github.io/Subterfuge/compartir-juego.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="juego"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
